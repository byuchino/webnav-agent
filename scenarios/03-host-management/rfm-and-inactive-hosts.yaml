id: rfm-and-inactive-hosts
name: Find hosts in RFM, and locate inactive sensors
target: console
mode: manual
domain: 3
difficulty: 2
duration_min: 20
objective: "3.1, 3.4, 3.5, 3.6, 3.7 — filtering, RFM impact and causes, inactive sensors, retention"

summary: >
  Reduced Functionality Mode is the most useful concept in this domain, because a host in RFM
  looks healthy in every naive check. Learn to find those hosts deliberately, and to find the
  ones that stopped reporting entirely.

teaches: |
  - What RFM is: a sensor running without a matching kernel module. It installs, it runs, it
    registers, and it collects almost nothing
  - Why that matters more than it sounds: every simple health check passes
  - What causes it — most often a kernel the installed sensor version does not support
  - How to filter Host Management to surface RFM hosts and inactive sensors
  - How long an inactive sensor is retained before it disappears
  - That asking the HOST about RFM is platform-specific and on Windows impossible, so the
    console/API field `reduced_functionality_mode` is the only answer that works fleet-wide

instructions: |
  Console work, with one thing to verify on the Linux guest.

  1. Host setup and management > Host management. Work out how to filter this page. Find:
       a. hosts in Reduced Functionality Mode
       b. hosts that have been inactive for some period
       c. hosts running a sensor version older than the current one
          (falcon-lab-win and falcon-lab-lnx are both on N-2, so they should appear)

  2. Find the retention answer in the console or the documentation rather than guessing:
     how long is an inactive sensor kept before it is removed? Note where you found it —
     the exam asks for the number, and knowing where it is stated is more durable than
     memorising it.

  3. Determine the RFM state of each of your own lab hosts — whatever that state turns out
     to be — and learn why "ask the host" is not a strategy that survives a mixed fleet.

     Do not assume the answer is "healthy". At least one of your hosts may well be in RFM
     without anyone having put it there, which is the honest version of this lesson: RFM
     arrives on its own, usually because the OS patched itself past what the installed sensor
     supports. Finding that is a pass, not a failure.

     On the **Linux** host: press **terminal** on the `falcon-lab-lnx` card (or this card's
     Linux terminal button) and run:
         sudo /opt/CrowdStrike/falconctl -g --rfm-state

     Note the output format. It prints with a trailing period — `rfm-state=false.` — which
     is exactly the sort of detail that breaks a naive string comparison. This lab's own
     grader had that bug and reported a healthy sensor as being in RFM.

     On the **Windows** host: press **terminal** on the `falcon-lab-win` card and look for
     the equivalent. There isn't one. This is the point of the step, not a gap in it:

       - there is no `falconctl` on Windows at all
       - `CSSensorSettings.exe` — the closest thing — only gets and sets proxy settings,
         grouping tags and `--no-rtr`. Run `& "C:\Program Files\CrowdStrike\CSSensorSettings.exe"
         --help` and read the list; RFM is not on it
       - `sc query csagent` shows the kernel driver RUNNING, which looks like an answer and
         is not one. RFM is about the sensor running *without a matching kernel module*, so a
         service that is up tells you nothing about whether it is functional

     On **macOS** (when the Mac guest joins the lab) there is a falconctl again, at
     `/Applications/Falcon.app/Contents/Resources/falconctl` — a different binary with a
     different subcommand set from the Linux one. Treat its RFM output as unverified until
     someone has run it here; this lab has not.

     So: three platforms, three different answers, one of which is "you cannot ask". The
     only question that works everywhere is the one you asked in step 1 — the console's RFM
     column, backed by the device field `reduced_functionality_mode` (`yes`/`no`/`unknown`).
     The sensor reports its own state upward, so the cloud knows even when the host offers
     no way to ask locally. That is why this scenario's automated RFM check goes through the
     API and not through a shell, and why it will cover the Mac the day it appears.

  4. Check your work — press **grade** on this scenario's card in the control panel, or with shell access run:
         lab grade rfm-and-inactive-hosts

expect:
  console: Host management, with filters applied for RFM / inactive / sensor version
  detection: none

verify:
  # Deliberately state-AGNOSTIC. These assert that the cloud can tell you each host's RFM
  # state, not that the state is healthy. An exercise about FINDING hosts in RFM must not
  # fail the moment there is one to find -- and there is: a Windows update put FALCON-LAB-WIN
  # into RFM, and the lnx guest has a `clean-rfm` baseline you can revert to on purpose.
  # Whether the state is GOOD is a judgement, and judgements belong in attest.
  - kind: api
    label: linux RFM state readable from the cloud
    assert: rfm_state
    target: lnx
    expect: known
  - kind: api
    label: windows RFM state readable from the cloud (no host command exists)
    assert: rfm_state
    target: win
    expect: known
  - kind: api
    label: host management shows both lab hosts
    assert: hosts_matching
    contains: "FALCON-LAB"
    at_least: 2
  - kind: attest
    label: filtering, retention, and what you actually found
    items:
      - "I filtered Host management to show hosts in RFM"
      - "I filtered for inactive sensors"
      - "I found the inactive-sensor retention period and can say where it is documented"
      - "I know which of my hosts are in RFM right now, and which are not"
      - "I read the Linux host's RFM state myself with falconctl, in the panel terminal"
      - "I looked for a Windows equivalent and satisfied myself that none exists"

hint: >
  The two RFM checks assert that the CLOUD can tell you each host's state, not that the state
  is healthy — so a host sitting in RFM still passes them. That is deliberate: this exercise
  is about finding RFM hosts, and a grader that failed whenever one existed would be grading
  the lab's condition instead of your work. Judging whether the state is acceptable is yours,
  in the attest list. Both checks go through the API because that is the only read that works
  on every platform — Linux also answers host-side via falconctl, Windows answers nowhere at
  all, and a Mac would answer differently again.
  The remaining API check counts VISIBLE hosts matching "FALCON-LAB" — hidden
  hosts are excluded, so a host you hid during the stale-host exercise will not be counted, and
  fewer than two means one is hidden, deleted, or never enrolled rather than merely offline.
