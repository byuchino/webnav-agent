id: induce-rfm
name: Investigate a host in Reduced Functionality Mode
target: lnx
baseline: rfm
mode: guided
domain: 3
difficulty: 2
duration_min: 20
objective: "3.4, 3.5 — explain the impact of RFM and why it is caused; find hosts in RFM"
requires: [sensor-install-lnx]

summary: >
  Press set up and the Linux guest comes back already in RFM. Your job is to notice, work out
  why, and find it from the console — not to break it yourself. Reading about RFM teaches the
  definition; looking at a sensor that reports in and collects almost nothing teaches why it
  matters.

teaches: |
  - That an RFM host is ONLINE, recently seen, and its service is active — every naive check
    passes
  - The actual cause: no kernel module matching the running kernel
  - That falconctl will tell you the reason and the history, not just the state
  - How to find RFM hosts from the console before someone relies on one for protection
  - What is lost: on Linux, network containment does not work in RFM
  - That a modern sensor on `auto` avoids RFM entirely by falling back to eBPF user mode —
    which is why this state had to be constructed deliberately

setup:
  - name: confirm the guest came back in RFM
    shell: |
      printf 'kernel:  %s\n' "$(uname -r)"
      printf 'service: %s\n' "$(systemctl is-active falcon-sensor)"
      printf 'backend: %s\n' "$(sudo -n /opt/CrowdStrike/falconctl -g --backend 2>&1)"
      printf 'rfm:     %s\n' "$(sudo -n /opt/CrowdStrike/falconctl -g --rfm-state 2>&1)"
    expect_contains: "rfm-state=true"

instructions: |
  The guest has been reverted to a baseline where the sensor is already in RFM. Note what the
  setup step printed: the service is **active**. Nothing about "is it running" tells you this
  host is barely protected.

  1. Ask the sensor why, on the host itself:

         ssh -i ~/.ssh/falcon_lab_ed25519 labadmin@10.77.0.11
         sudo /opt/CrowdStrike/falconctl -g --rfm-state
         sudo /opt/CrowdStrike/falconctl -g --rfm-reason
         sudo /opt/CrowdStrike/falconctl -g --rfm-history

     The reason should be a missing modules file. Compare `uname -r` against the sensor
     version and you have the whole story: a kernel the sensor has no module for.

  2. Now find it from the console, which is objective 3.5. Host management, filtered to hosts
     in Reduced Functionality Mode. Confirm falcon-lab-lnx appears, and look at the host
     detail panel — it should still show as online with a recent Last seen. That gap between
     "looks fine" and "is fine" is the entire point.

  3. Work out the consequence. The documentation is explicit about one: network containment
     does **not** work on a Linux host in RFM, though it does on Windows and macOS. A host
     you believe you could isolate during an incident, and could not.

  4. Check your work:
         lab grade induce-rfm

  5. Put it back when you are done:
         ./lab.py revert lnx sensor

  How this state was built, because it is worth knowing and it is not obvious. Simply booting
  an unsupported kernel is NOT enough on a current sensor: with `--backend=auto` it falls back
  to eBPF user mode and stays perfectly healthy. Reproducing RFM took both an unsupported
  kernel (7.0.0-28, against a sensor built for 6.8) AND `falconctl -s --backend=kernel` to
  stop it taking the user-mode escape route. The first attempt at this exercise assumed the
  kernel alone would do it, and the sensor came back reporting `rfm-state=false`.

expect:
  console: |
    Host management filtered to RFM — falcon-lab-lnx present, online, recently seen.
  detection: none

verify:
  - kind: endpoint
    label: sensor is in RFM
    shell: sudo -n /opt/CrowdStrike/falconctl -g --rfm-state 2>&1
    expect_contains: "rfm-state=true"
  - kind: endpoint
    label: the service is nevertheless running
    shell: systemctl is-active falcon-sensor
    expect_contains: active
  - kind: attest
    label: what you found
    items:
      - "I read the RFM reason from falconctl and can state it"
      - "I found the host using an RFM filter in the console"
      - "The console still showed it online with a recent Last seen"
      - "I can say what network containment does on a Linux host in RFM"

hint: >
  If the RFM check reports false, the guest is probably on the healthy `sensor` baseline
  rather than `rfm` — press set up again, or run `./lab.py revert lnx rfm`. Note that the
  standard `sensor` check used by other scenarios treats RFM as a FAILURE, which is right
  everywhere except here, where it is the desired state.
