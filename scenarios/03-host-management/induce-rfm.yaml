id: induce-rfm
name: Investigate a host in Reduced Functionality Mode
target: lnx
baseline: rfm
mode: guided
domain: 3
difficulty: 2
duration_min: 25
objective: "3.4, 3.5 — explain the impact of RFM and why it is caused; find hosts in RFM"
requires: [sensor-install-lnx, lab-host-group]

summary: >
  Press set up and the Linux guest comes back already in RFM. Find it from the console, work
  out why, and reach it the way you would in production — with Real Time Response, not SSH.
  Reading about RFM teaches the definition; investigating a live degraded sensor from the
  console teaches why it matters and how you would actually respond to one.

teaches: |
  - That an RFM host is ONLINE, recently seen, and its service is active — every naive check
    passes
  - The actual cause: no kernel module matching the running kernel
  - How to find RFM hosts from the console before someone relies on one for protection
  - Real Time Response (RTR) as the real-world way to reach a host you have no shell on — which
    is the whole reason RTR exists, and is on the CCFA exam
  - The three gates on RTR: the host must be online, in a group with a response policy that has
    RTR enabled, and you must hold an RTR role — the Falcon Administrator role does NOT include
    RTR, and the default response policy has `run` and Custom Scripts disabled
  - That RTR still works on a Linux sensor in RFM: it connects AND runs commands (confirmed in
    this lab — `ls` and `ps` returned real output on the RFM host). RFM degrades telemetry and
    prevention, but the RTR response path rides the sensor's cloud channel, which RFM keeps up —
    so a host that falls into RFM is still reachable and remediable
  - What is lost: on Linux, network containment does not work in RFM
  - That a modern sensor on `auto` avoids RFM entirely by falling back to eBPF user mode —
    which is why this state had to be constructed deliberately

setup:
  - name: confirm the guest came back in RFM
    shell: |
      printf 'kernel:  %s\n' "$(uname -r)"
      printf 'service: %s\n' "$(systemctl is-active falcon-sensor)"
      printf 'backend: %s\n' "$(sudo -n /opt/CrowdStrike/falconctl -g --backend 2>&1)"
      printf 'rfm:     %s\n' "$(sudo -n /opt/CrowdStrike/falconctl -g --rfm-state 2>&1)"
    expect_contains: "rfm-state=true"

instructions: |
  The guest has been reverted to a baseline where the sensor is already in RFM. The setup step
  read the truth straight off the box over SSH — but that is a lab convenience. In production
  you would have no shell on the endpoint, which is exactly the situation Real Time Response is
  built for. So do this the real way.

  1. FIND IT (objective 3.5). Host setup and management > Manage endpoints > Host management,
     and filter to hosts in Reduced Functionality Mode — under the hood that filter is the FQL
     `reduced_functionality_mode:'yes'`, the same field for every platform. To see the RFM state
     in the table you may need to turn the column on: click the **configure table columns** icon
     above the table and enable **RFM**. Confirm falcon-lab-lnx appears.

     Now click the **host name** to open its **summary panel** (it slides in from the right).
     The console flags the condition prominently — a warning banner reads:

         Warning: Host is in RFM (Reduced Functionality Mode)

     Expand the **Host Info** section (it is collapsed by default) to see the host's status
     details: its **Last seen** is current and it was seen recently. That is what makes RFM
     dangerous — every naive "is it up?" check passes. But notice what the banner and Host Info
     give you: the fact that the host IS in RFM (status). They do **not** tell you *why* — the
     console surfaces the status, not the reason. That gap between "looks fine" and "is fine",
     and the fact that the reason lives on the host, is exactly why step 2 exists.

  2. REACH IT WITH RTR, not SSH. **Connect to host** lives on the host row's **⋮ (three-dots)**
     menu — and if the summary panel is open it sits ON TOP of those dots, so **close the summary
     panel first**. The same action appears on a detection's Event Actions menu. Before it
     connects, know what has to be true — this is the part the exam tests:

       - the host is online (an RFM host still is),
       - it is in a group assigned a **response policy with Real Time Response enabled**,
       - and you hold a **Real Time Responder** role. The **Falcon Administrator role does not
         include RTR** — a common real-world surprise.

     Read the menu item's state, because it tells you which gate you are behind:

       - If it reads **"Cannot connect to host" with a lock** and is greyed out, that is a
         PERMISSION gate — your user is not entitled to RTR. It is almost always a missing
         Responder role (Falcon Administrator alone does not grant it); a response policy with
         RTR disabled can gate it too. The lock is about YOU, not the host — it would look the
         same on a perfectly healthy host. Fix it by assigning your user an RTR role (Active
         Responder is enough), then return here.
       - If it is **enabled**, you hold RTR and can connect.

     Once you CAN connect, an important question about RFM's impact (objective 3.4) answers
     itself: **does RTR still work on a host in RFM?** It does — confirmed in this lab. The
     session connects (status **Connected**) and commands run: `ls /opt/CrowdStrike` and `ps`
     both returned real output on the RFM host. The reason is that RFM degrades telemetry and
     prevention — the kernel-level work — but RTR rides the sensor's cloud channel, which stays
     up, which is also why the host still reports online. Operationally that is good news: a host
     that falls into RFM is still reachable and remediable over RTR. Connect and run a couple of
     commands yourself to see it. (Any locked "Cannot connect to host" you saw earlier was a
     permission gate on YOUR account — a missing Responder role — unrelated to the host's RFM.)

  3. RECONNOITRE OVER RTR. In the RTR session, run a few read-only commands — `ps` to see
     `falcon-sensor` running, `ls /opt/CrowdStrike` for the sensor's files, and `cat` the sensor
     logs. On Linux those logs live in **/var/log**, not under /opt/CrowdStrike:
     `falcon-sensor.log`, `falcond.log`, `falconctl.log`, and `falcon-libbpf.log` (the eBPF
     backend). `cat` is a read-only command, so any Responder role can read them. The live
     runtime message stream is also in the systemd journal (`journalctl -u falcon-sensor`) — but
     reading that means running a binary, i.e. the `run` command, which needs Administrator plus
     a policy that permits run.
     Reading the RFM reason and history the way the setup step did means running the falconctl
     binary, i.e. the RTR **`run`** command — and `run` needs the **RTR Administrator** role AND
     a response policy with `run` enabled (the default policy has it OFF). Notice that gate:
     read-only reconnaissance is available widely, but executing a binary on the host is
     deliberately harder to reach. That is response-policy design (Domain 5), not an accident.

  4. UNDERSTAND THE CONSEQUENCE. The documentation is explicit about one loss: network
     containment does **not** work on a Linux host in RFM, though it does on Windows and macOS.
     A host you believe you could isolate during an incident, and could not.

  5. Check your work:
         lab grade induce-rfm

  6. Put it back when you are done:
         ./lab.py revert lnx sensor

  Why SSH is only in the background here: this lab keeps an SSH key on the guests so the grader
  can read ground truth out of band — an answer key, not a method. Production endpoints give you
  no such thing, so every step you would actually perform on a real RFM host goes through the
  console and RTR.

  How this state was built, because it is worth knowing and is not obvious. Booting an
  unsupported kernel is NOT enough on a current sensor: with `--backend=auto` it falls back to
  eBPF user mode and stays healthy. Reproducing RFM took both an unsupported kernel (7.0.0-28,
  against a sensor built for 6.8) AND `falconctl -s --backend=kernel` to stop it taking the
  user-mode escape route. The first attempt assumed the kernel alone would do it, and the sensor
  came back reporting `rfm-state=false`.

expect:
  console: |
    Host management filtered to RFM — falcon-lab-lnx present, online, recently seen — and an
    attempt to Connect to host via RTR, with the outcome (connected / blocked) noted.
  detection: none

verify:
  # The endpoint checks below are the lab's OUT-OF-BAND ground truth over SSH -- the grader's
  # answer key, not the method the exercise teaches. What the learner does is console + RTR.
  - kind: endpoint
    label: "(ground truth) sensor is in RFM"
    shell: sudo -n /opt/CrowdStrike/falconctl -g --rfm-state 2>&1
    expect_contains: "rfm-state=true"
  - kind: endpoint
    label: "(ground truth) the service is nevertheless running"
    shell: systemctl is-active falcon-sensor
    expect_contains: active
  - kind: attest
    label: what you did in the console
    items:
      - "I found the host using the RFM filter in Host management (RFM column turned on)"
      - "The summary panel showed a 'Host is in RFM' warning banner, and a recent Last seen in Host Info"
      - "I got the RFM reason from the host itself (falconctl via RTR) — the console shows status, not reason"
      - "I connected via RTR to the RFM host and ran commands — confirming RTR works despite RFM"
      - "I can name RTR's three gates: online, a response policy with RTR enabled, and an RTR role"
      - "I know the Falcon Administrator role does not by itself grant RTR"
      - "I can say what network containment does on a Linux host in RFM"

hint: >
  If the RFM check reports false, the guest is probably on the healthy `sensor` baseline rather
  than `rfm` — press set up again, or run `./lab.py revert lnx rfm`. If RTR's Connect to host is
  unavailable, check the role and the response policy before suspecting the host: Falcon
  Administrator alone does not grant RTR, and the target group needs a response policy with RTR
  enabled. Note that the standard `sensor` check used by other scenarios treats RFM as a
  FAILURE, which is right everywhere except here, where it is the desired state.
