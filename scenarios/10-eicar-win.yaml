id: eicar-win
name: EICAR test file on Windows
target: win
baseline: sensor        # needs a registered sensor -- runner reverts here automatically
mode: auto
technique: null
syllabus: CCFA - detections, prevention policy behaviour

summary: >
  Write the EICAR test string to disk. The industry-standard harmless test file: it is not
  malware, it triggers by signature agreement across vendors. Run this first, because it
  proves the whole pipeline end to end before anything subtle.

teaches: |
  - That the endpoint, sensor, cloud and console are all actually connected
  - The difference between a DETECTION and a PREVENTION, which is set by policy
  - Where a detection surfaces, and how long it takes to appear
  - What the process tree looks like for a file-write detection

steps:
  - name: confirm a sensor is present before doing anything
    shell: |
      $s = Get-Service CSFalconService -ErrorAction SilentlyContinue
      if (-not $s) { Write-Output 'NO SENSOR'; exit 1 }
      Write-Output "sensor service: $($s.Status)"
    expect_contains: "sensor service"

  - name: write the EICAR string to disk
    # Assembled from parts at runtime on purpose: a literal EICAR string in the repo would
    # be flagged by any scanner on the machine holding this checkout.
    shell: |
      New-Item -ItemType Directory -Force -Path C:\lab | Out-Null
      $p1 = 'X5O!P%@AP[4\PZX54(P^)7CC)7}'
      $p2 = '$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*'
      Set-Content -Path C:\lab\eicar.com -Value ($p1 + $p2) -Encoding ascii -NoNewline
      Start-Sleep -Seconds 3
      if (Test-Path C:\lab\eicar.com) { 'file still present' } else { 'file removed by prevention' }

expect:
  console: |
    Endpoint security > Endpoint detections, within a minute or two.
    Filter to host falcon-lab-win. Open the detection and read the process tree:
    the writing process should be powershell.exe, with the full command line captured.
  detection: >
    A malware detection on falcon-lab-win. Whether the file survives depends entirely on
    the prevention policy applied to this host's group -- that is the point of the exercise.

grade:
  shell: |
    if (Test-Path C:\lab\eicar.com) { 'present' } else { 'removed' }
  hint: >
    Either outcome is a valid result. "present" means the policy is detect-only, so the
    detection fired but nothing was blocked. "removed" means prevention quarantined it.
    If you see NEITHER a detection nor a removal, the sensor is not reporting -- check
    `lab sensor win` first.
