id: ml-exclusion
name: Exclusions — five tabs, three blast radii, and an ML exclusion you can verify
target: console
mode: manual
domain: 6
difficulty: 2
duration_min: 20
objective: "6.x — distinguish exclusion types and their scope/risk; configure a Machine Learning exclusion"
requires: [lab-host-group]

summary: >
  Exclusions tell Falcon to stop acting on something — and the exam cares that you know which
  type does what, because they differ enormously in blast radius. The console shows FIVE tabs,
  but only three sit on that scale; the other two are a different key (certificate) and a
  different job (application abuse). You will compare them, then configure a Machine Learning
  exclusion for a path and assign it to the Falcon Lab group. The grader confirms it via the API; the effect itself is understood, not triggered
  (see the note below on why).

teaches: |
  - That the Exclusions page has FIVE tabs, and which of them are comparable: three sit on a
    blast-radius scale, ML (certificate) is the same job as ML (file path) keyed on the signer
    rather than the location, and Application abuse approves RMM tools against an
    application-abuse prevention policy rather than suppressing a false positive
  - The three comparable types and their scope, smallest blast radius to largest:
      * IOA exclusion — suppresses specific IOA-rule detections only
      * Machine Learning exclusion — suppresses only ML detections/preventions on a path; IOAs,
        IOCs and other detection logic on that path still fire
      * Sensor Visibility exclusion — the sensor stops generating events for the path AT ALL,
        which removes telemetry and every detection type — the biggest blind spot, use sparingly
  - That an ML exclusion is a deliberate BLIND SPOT: malware dropped in that path is ignored by
    ML, so exclusions are a false-positive tool of last resort, scoped as tightly as possible
  - That exclusions are matched by a path/glob VALUE and applied to host groups (or globally)
  - Why "exclude from ML" is not "exclude from everything" — the distinction the exam draws

instructions: |
  No guest is touched here — this is console configuration plus understanding.

  1. COMPARE THE TYPES FIRST. Endpoint security > Configure > Exclusions. There are **five**
     tabs, and they are not five points on one scale — they are two different jobs:

       - Machine learning (file path) exclusions
       - Machine learning (certificate) exclusions
       - IOA exclusions
       - Sensor visibility exclusions
       - Application abuse exclusions

     **Three of them answer "stop Falcon reacting to this thing", and they differ by BLAST
     RADIUS** — this is the mental model to lock in, and what the exam probes:

       - **IOA** — narrowest. Suppresses specific rule detections; everything else still watches
       - **Machine learning** — narrower still than you might assume: only ML stops acting. IOAs
         and everything else continue
       - **Sensor visibility** — the biggest hammer. No events at all for that path, so the
         sensor is blind there and every other control loses its input too

     Choosing the wrong one either misses the false positive you were trying to silence, or
     blinds you far more than you intended.

     **The other two are different axes, not more of the same:**

       - **Machine learning (certificate)** is the same job as ML (file path) by a different
         key — exclude what a trusted publisher SIGNED rather than where a file happens to sit.
         Better where a vendor's binaries move or auto-update, since a path exclusion goes stale
         and a certificate does not
       - **Application abuse** is not false-positive suppression at all. It designates specific
         RMM tools as approved so an application-abuse *prevention policy* will not block them —
         letting you run default-prevent on remote-management tooling while permitting the ones
         you sanction. Also reachable at Endpoint security > Application Abuse

     For the rest of this exercise only the blast-radius three matter. But knowing there are five
     is the difference between reading that page and guessing at it.

  2. CREATE A MACHINE LEARNING EXCLUSION. On the **Machine learning (file path)** tab — not
     the certificate one — add an exclusion:
       - Path / value: something containing **FalconLabMLX**, e.g. `C:\FalconLabMLX\*`
         (the grader matches on that distinctive folder name, whatever glob format the console
         uses).
       - Exclude from: detections (and preventions, if offered).
       - Apply to: the **Falcon Lab** host group — NOT "all hosts". Scoping to a group is the
         habit to build; a global exclusion is a CID-wide blind spot.
     Save.

  3. UNDERSTAND WHAT YOU JUST DID. Files under that path are now invisible to Falcon's ML on the
     Falcon Lab hosts. IOAs and IOCs would still act on them — that is the whole point of ML
     being a separate, narrower exclusion than Sensor Visibility. State to yourself why you would
     ever want this (a trusted app the ML keeps flagging) and why you would scope it tightly.

  4. Check your work — press **grade** on this scenario's card in the control panel, or with
     shell access run:
         lab grade ml-exclusion

  Why there is no "prove it works" step: unlike the custom-IOA exercise, an ML exclusion cannot
  be demonstrated safely. Proving ML *stopped* detecting something requires a file ML actually
  flags — i.e. real malware — which has no place in a teaching lab. So this exercise verifies the
  exclusion is CONFIGURED (via the API) and tests that you understand its effect; it does not
  trigger an ML detection to watch it be suppressed. The exam tests the concepts and the
  configuration, which is exactly what this covers.

expect:
  console: |
    A Machine Learning exclusion whose path contains FalconLabMLX, applied to the Falcon Lab host
    group (not globally).
  detection: none

verify:
  - kind: api
    label: an ML exclusion for the FalconLabMLX path is assigned to Falcon Lab
    assert: ml_exclusion
    path_contains: "FalconLabMLX"
    group: "Falcon Lab"
  - kind: attest
    label: understanding
    items:
      - "I can rank the three comparable types by blast radius (IOA < ML < Sensor Visibility)"
      - "I know the page has five tabs, and that certificate and application-abuse exclusions
         are a different key and a different job rather than more points on that scale"
      - "I know an ML exclusion suppresses only ML — IOAs and IOCs still act on that path"
      - "I scoped the exclusion to the Falcon Lab group, not to all hosts"
      - "I can explain why an exclusion is a deliberate blind spot and a last resort"

hint: >
  If the check reads absent: confirm the exclusion is on the MACHINE LEARNING (FILE PATH) tab —
  not certificate, sensor visibility, IOA or application abuse — that its path actually contains FalconLabMLX, and that it is applied to the
  Falcon Lab group or globally — an exclusion assigned to no group (or a different one) will not
  match. The grader substring-matches the path value, so the exact glob format does not matter,
  only that FalconLabMLX appears in it.