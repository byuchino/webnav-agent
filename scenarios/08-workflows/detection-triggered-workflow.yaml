id: detection-triggered-workflow
name: A workflow that fires on a detection
target: win
baseline: sensor
mode: guided
domain: 8
difficulty: 3
duration_min: 30
objective: "8.1 — configure workflows to respond to defined triggers"
requires: [eicar-win, lab-host-group]

summary: >
  Build a workflow triggered by a detection on the lab group, then cause a detection and watch
  it run. Domain 8 is one objective long, but it is the only one where you make the platform
  act on its own, and the exam expects you to know the trigger/condition/action shape.

teaches: |
  - The anatomy of a workflow: a trigger, optional conditions, one or more actions
  - Scoping a trigger so it fires on the lab group and nothing else — the single most
    important safety habit here
  - The difference between a notification action and one that changes state on a host
  - Where to see execution history when a workflow does not fire

setup:
  - name: clear any leftover EICAR file so the trigger is unambiguous
    shell: |
      Remove-Item C:\lab\eicar.com -ErrorAction SilentlyContinue
      $s = Get-Service CSFalconService -ErrorAction SilentlyContinue
      if (-not $s -or $s.Status -ne 'Running') { Write-Output 'SENSOR NOT RUNNING'; exit 1 }
      Write-Output 'ready'
    expect_contains: ready

instructions: |
  Scope this carefully before you build it. A workflow that acts on every detection in the
  tenant is a genuinely bad thing to create by accident, and this is a production CID.

  1. Find Workflows (Fusion / workflow automation) in the console. Create a new workflow:

       Trigger:    a new detection
       Condition:  restrict it to the **Falcon Lab** host group — do this FIRST, before you
                   add any action, so there is never a moment where it is unscoped
       Action:     send a notification (email or a message). Do NOT choose an action that
                   contains or otherwise changes a host, even though this is a lab: the habit
                   is what you are building

  2. Enable it, then cause a detection. In the control panel, tick **keep state** on the
     eicar-win card and press **set up** (keep state so the Windows host is not reverted, which
     would undo nothing here but wastes minutes). With shell access: `./lab.py run eicar-win
     --no-revert`.

  3. Find the workflow's execution history and confirm it ran. If it did not, work through:
     is it enabled; did the detection match the condition; is the host actually in Falcon Lab;
     did the detection arrive after the workflow was enabled.

  4. Then disable it. Leaving an enabled workflow behind in a production tenant after a lab
     exercise is exactly the kind of thing that surprises someone later.

  5. Check your work — press **grade** on this scenario's card in the control panel, or with shell access run:
         lab grade detection-triggered-workflow

expect:
  console: Workflows — your workflow, and its execution history showing a run
  detection: The EICAR detection that triggered it, on falcon-lab-win

verify:
  - kind: endpoint
    label: the triggering detection was caused
    shell: |
      if (Test-Path C:\lab\eicar.com) { 'eicar written' } else { 'eicar removed by prevention' }
  - kind: attest
    label: the workflow itself
    items:
      - "My workflow is scoped to the Falcon Lab group, not the whole tenant"
      - "Its execution history shows a run caused by my EICAR detection"
      - "I disabled it afterwards"

note: >
  No Fusion/workflow route appears in this tenant's console sitemap, so there is no
  console check here. If your tenant has workflow automation, add a `console` check
  pointing at its path — `lab/falcon.py` will read the API response the page fetches.

hint: >
  The endpoint check passes either way — both outcomes mean the detection happened, which is
  all this check claims. Whether the workflow FIRED is attested, because the console check
  cannot tell your workflow from any other without knowing its name. If it did not fire, the
  usual cause is ordering: a workflow only acts on detections that arrive after it was
  enabled.
