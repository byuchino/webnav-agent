id: sensor-install-lnx
name: Install the Falcon sensor on Linux
target: lnx
baseline: bare
mode: manual
technique: null
syllabus: CCFA - sensor deployment, RFM troubleshooting

summary: >
  Install the Linux sensor by hand. The Linux flow separates installing the package from
  setting the CID from starting the service, so there are three distinct ways to end up
  with something that looks installed and is not working.

teaches: |
  - The three-step Linux flow: dpkg -i, falconctl -s --cid, systemctl start
  - falconctl as the local source of truth: -g --cid, -g --aid, -g --rfm-state
  - Reduced Functionality Mode: what it is, how to spot it, why it matters
  - Why "systemctl is-active" is a weak test of a working sensor

instructions: |
  The Linux host has been rolled back to a clean, sensor-free state.

  1. Get the .deb for Ubuntu from Host setup and management > Sensor downloads,
     and your CID with checksum from the same page.

  2. Copy it over:
         scp -i ~/.ssh/falcon_lab_ed25519 falcon-sensor_*.deb labadmin@10.77.0.11:/tmp/

  3. On the host (ssh -i ~/.ssh/falcon_lab_ed25519 labadmin@10.77.0.11):
         sudo dpkg -i /tmp/falcon-sensor_*.deb
         sudo /opt/CrowdStrike/falconctl -s --cid=<your-cid-with-checksum>
         sudo systemctl start falcon-sensor

  4. Check your work:
         lab grade sensor-install-lnx

  Worth doing deliberately:
   - After step 3's first command only, run `lab grade`. The package is installed and the
     service will not start usefully, because no CID has been set.
   - Read the RFM state yourself:
         sudo /opt/CrowdStrike/falconctl -g --rfm-state
     RFM means the sensor loaded without a matching kernel module. It runs, it reports in,
     and it collects almost nothing. A host in RFM looks healthy in every naive check --
     which is exactly why the grader treats RFM as a failure rather than a pass.

expect:
  console: Host management -- falcon-lab-lnx appears, with its kernel version listed
  detection: none

grade:
  kind: sensor
  hint: |
    Work down the chain, because each step can fail independently:
      dpkg -l falcon-sensor                          package present?
      sudo /opt/CrowdStrike/falconctl -g --cid       CID set?
      systemctl status falcon-sensor                 service running?
      sudo /opt/CrowdStrike/falconctl -g --aid       registered with the cloud?
      sudo /opt/CrowdStrike/falconctl -g --rfm-state should be false
