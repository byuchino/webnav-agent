id: quarantined-files
name: Quarantined files — produce one, review it, and know the actions
target: win
baseline: sensor
mode: guided
domain: 5
difficulty: 2
duration_min: 25
objective: "manage quarantined files: what quarantine is, how to review, and release/undo/delete"
requires: [lab-host-group, prevention-detect-vs-block]

summary: >
  When Falcon quarantines a file it is not deleted — it is encoded, renamed and moved to a
  managed store you can review and act on. You produce a real quarantined file from a harmless
  binary the lab blocklists for you, find it in the console, and learn the actions the exam asks
  about: release, undo release, delete.

teaches: |
  - What quarantine is: a file the sensor treats as malicious is ENCODED, RENAMED and MOVED to a
    protected store — not merely blocked, and not deleted, so it can be reviewed or restored
  - That quarantine is an EXECUTION-time action: the sensor quarantines a suspicious file
    "attempting to run". Writing a bad file to disk is not enough on its own
  - That it must first be enabled in the PREVENTION policy — no setting, no quarantine
  - The management actions and their meaning:
      * Release — restore the file; the sensor stops treating it as malicious. Released files
        from removable media go to C:\ProgramData\CrowdStrike
      * Undo Release — re-arm it: treated as malicious again and re-quarantined the NEXT time it
        executes, not immediately
      * Delete — remove the quarantined file
  - Offline behaviour: a release for an offline host applies when it returns within 30 days;
    after 30 days offline the file stays quarantined

setup:
  - name: confirm the sensor is healthy
    shell: |
      $s = Get-Service CSFalconService -ErrorAction SilentlyContinue
      if (-not $s -or $s.Status -ne 'Running') { Write-Output 'SENSOR NOT RUNNING'; exit 1 }
      Write-Output 'ready'
    expect_contains: ready

  # Builds a harmless console app on the guest and blocklists its hash. Scaffolding, not the
  # lesson: writing an IOC is what `ioc-blocklist-hash` teaches, and this exercise is about
  # managing the quarantined file that results. The graded artifact is the QUARANTINE record,
  # which is downstream of this — so a broken stager fails the exercise rather than passing it.
  - name: stage a blocklisted test binary (built locally, never downloaded)
    stage: quarantine_bait

instructions: |
  The lab has built `C:\lab\labtest.exe` on the Windows host — a five-line C# console app that
  prints a string — and added its SHA256 to your custom IOC blocklist with action **prevent**,
  scoped to the **Falcon Lab** group. It is harmless: the point is that Falcon has been *told* to
  treat it as malicious, which is a safe way to produce a real quarantine event without real
  malware.

  ## 1. Confirm quarantine is enabled

  Endpoint security > Prevention policies > Windows > the policy applied to **Falcon Lab**. You
  need **Quarantine & Security Center Registration** enabled, and **Execution Blocking > Custom
  Blocking** (that is what acts on your IOC blocklist). The Phase 1 template has neither; Phase 2
  and 3 have both. Wait for the policy to APPLY to the host.

  ## 2. Run the binary — twice if needed

  In the guest terminal:

      C:\lab\labtest.exe

  The first run may simply print `falcon-lab <marker>` and exit: the IOC takes a few minutes to
  reach the sensor. Wait a minute and run it again. Once the IOC has landed you get:

      Program 'labtest.exe' failed to run: Access is denied

  That is the prevention. **Now look at the file** — `Test-Path C:\lab\labtest.exe` reads False.
  It has not been deleted; it has been moved.

  ## 3. Review it in the console — this is the job

  Endpoint security > Monitor > **Quarantined files**. Find `labtest.exe` on **FALCON-LAB-WIN**
  and open it. Note the **hash**, the **originating path**, the **host**, and the **state** —
  this is the record you triage during an incident, and everything you need is here.

  Expect it a minute or two after the host quarantines it: the host acts first and the console
  catches up. If the file is gone from disk but the console is empty, the answer is *wait*.

  ## 4. Optional — see the mechanism, the way you'd actually reach a host

  Step 3 is the standard operating procedure and it is sufficient. This step exists only to make
  one claim concrete: a quarantined file is **not deleted**. If you want to see that for
  yourself, reach the host the sanctioned way — **RTR**, not a remote desktop or an SSH session.

  Host management > find `falcon-lab-win` > **Connect to host**, then:

      ls C:\Windows\System32\drivers\CrowdStrike\Quarantine

  Two entries named for the SHA256: the encoded original and a `.csq` metadata sidecar. Encoded
  so it cannot execute, retained so it can be restored. (`ls` is in the base RTR command set, so
  Active Responder is enough — you do not need RTR Administrator for this.)

  Note what you are *not* doing: opening, copying or deleting anything in that directory. It is
  the sensor's store, and the console actions in step 5 are how you act on its contents.

  ## 5. Learn the actions (read; try Release if you like)

  **Release** restores the file and the sensor stops treating it as malicious on that host only.
  **Undo Release** re-arms it — re-quarantined on next execution, not immediately. **Delete**
  removes it. And the offline rule: a release for an offline host lands when it reconnects within
  30 days, otherwise the file stays quarantined.

  ## 6. Check your work

  Press **grade** on this card, or `lab grade quarantined-files`.

  You do not have to clean up. Staging is idempotent: each **set up** clears the lab's previous
  blocklist entry before adding a new one, so the CID never accumulates more than one, and each
  entry expires on its own after 7 days if you walk away. `./lab.py ioc clean` removes it now if
  you want it gone. All three only ever touch IOCs the lab tagged — yours are untouched.

expect:
  console: |
    Endpoint security > Monitor > Quarantined files showing labtest.exe on FALCON-LAB-WIN with
    its hash, originating path, and quarantined state.
  detection: >
    A CloudDetect-CustomerIOC-SHA256 alert on falcon-lab-win, tactic "Custom Intelligence" —
    the sensor acting on YOUR blocklist rather than on its own verdict.

verify:
  # First, because everything else on this host is meaningless in RFM.
  - kind: api
    label: host is NOT in reduced functionality mode
    assert: rfm_state
    target: win
    expect: "no"

  # The functional check. Reads the cloud quarantine store, so it also proves the record made it
  # off the host. It lags the host by a minute or two -- re-grade rather than concluding.
  #
  # within_min is NOT optional here. A quarantine record outlives both the file and the IOC that
  # caused it: staging removes the previous blocklist entry, the host store empties, and the
  # cloud record stays behind reading `state: quarantined`. Unbounded, this check passes on the
  # last run's artifact while the learner has done nothing.
  - kind: api
    label: "(functional) a file was quarantined on FALCON-LAB-WIN in this run"
    assert: quarantined_file
    hostname: "FALCON-LAB-WIN"
    name_contains: "labtest"
    within_min: 120

  # The host-side truth, which is immediate and independent of cloud propagation. If this passes
  # while the check above fails, the answer is "wait", not "something is broken".
  #
  # This is the GRADER reaching the host over ssh, which is lab automation -- it is deliberately
  # NOT what the exercise asks the learner to do. An analyst reviews quarantine in the console
  # and reaches a host through RTR; step 4 says so. Do not let a grader's convenience become a
  # taught habit.
  - kind: endpoint
    label: the encoded file is in the on-host quarantine store
    shell: |
      $q = "C:\Windows\System32\drivers\CrowdStrike\Quarantine"
      $n = (Get-ChildItem $q -Force -ErrorAction SilentlyContinue | Measure-Object).Count
      if ($n -gt 0) { "quarantined items: $n" } else { "EMPTY - nothing has been quarantined" }
    expect_contains: "quarantined items"

  - kind: attest
    label: understanding
    items:
      - "I saw the binary run once, then be denied after the IOC reached the sensor"
      - "I found the record in Quarantined files and can read its hash, path, host, and state"
      - "I can explain why quarantine is an EXECUTION-time action, not a write-time one"
      - "I know a quarantined file is moved and encoded, not deleted — and that the console is
         where you act on it, not the host's filesystem"
      - "I can explain Release vs Undo Release vs Delete"
      - "I know released files from removable media go to C:\\ProgramData\\CrowdStrike"
      - "I know an offline host's release applies when it returns within 30 days"

hint: >
  If nothing is quarantined, work back in this order. Is the host in RFM (the first check)? Is
  the applied prevention policy one that has BOTH Quarantine and Execution Blocking > Custom
  Blocking — the Phase 1 template has neither? Has the IOC reached the sensor yet: run the binary
  again, because the first run after staging usually still succeeds. And did you actually RUN it
  — writing a file to disk does not quarantine it, only attempting to execute one does. If the
  on-host check passes but the console check does not, the record simply has not propagated yet.
